name: Build Windows EXE 1.7.1 (Weekly Planner)

# ─────────────────────────────────────────────────────────────────────────────
#  دفترچهٔ v3 (تفاوت با v2 — هیچ چیز دیگری):
#   • گام T-2 پرامپت NOTE2 (حذف توکن‌های Electron/ و weekly-planner/ از
#     userAgentFallback برای عبور از فیلتر OAuth گوگل) عیناً داخل همین فایل
#     تزریق شد — چون electron-app/main.js در ریپو وجود ندارد (404) و
#     main.js اپ نهایی از همین heredoc ساخته می‌شود؛ ویرایش آن فایل در
#     محیط AI Studio به آرتیفکت ویندوزی نمی‌رسد.
#   • نام و کامنت‌های نسخه به 1.7.1 به‌روز شد (نسخهٔ واقعی مثل قبل از
#     package.json ریشه خوانده می‌شود).
#  دفترچهٔ v2 و بدنهٔ بیلد = عین build-windows-1.7.0-v2.yml (Task 97).
# ─────────────────────────────────────────────────────────────────────────────
#  بیلد نسخه ویندوز (اپلیکیشن دسکتاپ Electron) برای Weekly Planner 1.7.1
#  طراحی‌شده برای استفاده در ایران با اینترنت ایران
#
#  چرا Electron؟ برنامه یک اپ فول‌استک است: فرانت‌اند React/Vite + سرور API
#  اکسپرس (server.ts) که احراز هویت، سینک پلنر، تحلیل Gemini (با کلید خود
#  کاربر/BYOK) و پنل ادمین را انجام می‌دهد. بنابراین «نسخه ویندوز» باید هم
#  فرانت‌اند و هم سرور را لوکال اجرا کند — دقیقاً مثل `npm start` — که این
#  ورک‌فلو انجام می‌دهد:
#
#  ۱) فونت‌ها (وزیرمتن + Inter) کاملاً داخل بیلد باندل می‌شوند؛ هیچ وابستگی
#     به fonts.googleapis.com باقی نمی‌ماند (حتی بدون اینترنت، فونت‌ها هست).
#  ۲) کل برنامه (UI + سرور API) لوکال اجرا می‌شود؛ داده‌ها در localStorage
#     (مد آفلاین) ذخیره می‌شوند و سینک ابری (Firestore) هر وقت اینترنت/VPN
#     باشد خودکار ادامه پیدا می‌کند.
#  ۳) سرور فقط روی 127.0.0.1 گوش می‌دهد (بدون پاپ‌آپ فایروال ویندوز) و
#     به‌صورت خودکار روی اولین پورت آزاد از 3000 اجرا می‌شود.
#
#  ── فیلترشکن (VPN) — ترافیک برنامه از فیلترشکن کاربر رد می‌شود ──────────
#  • ترافیک UI (Firebase Auth/Firestore، Gmail، Calendar، پرووایدرهای
#    هوش مصنوعی از مرورگر داخلی): Chromium خودش «پروکسی سیستمی ویندوز» را
#    دنبال می‌کند؛ یعنی هر فیلترشکنی که System Proxy را روشن کند (v2rayN،
#    Clash Verge، Proton، ...) خودبه‌خود کل این ترافیک را پوشش می‌دهد و حتی
#    اگر وسط کار روشن/خاموش شود، Chromium بلافاصله خودش به‌روز می‌شود.
#  • ترافیک سمت Node (Gemini سرور، تأیید توکن Firebase در /api/*): Node
#    پروکسی سیستمی ویندوز را «نمی‌بیند» — بنابراین لانچر Electron قبل از
#    اجرای سرور، پروکسی سیستمی را با resolveProxy خودِ Chromium تشخیص
#    می‌دهد و به‌صورت HTTPS_PROXY/HTTP_PROXY (+NO_PROXY برای لوکال‌هاست)
#    به پروسه سرور تزریق می‌کند. server.ts همین متغیرها را با
#    EnvHttpProxyAgent (undici) و firebase-admin با HttpsProxyAgent
#    اعمال می‌کند؛ یعنی ترافیک AI سمت سرور هم از فیلترشکن شما رد می‌شود.
#    اثرش در لاگ قابل مشاهده است: در server.log باید خط
#    «[Server Proxy] undici EnvHttpProxyAgent configured...» ببینید.
#  • اگر متغیر HTTPS_PROXY را خودتان ست کرده باشید، تشخیص خودکار رد
#    می‌شود و مقدار شما حاکم است.
#  • محدودیت‌های شفاف:
#      - فیلترشکن‌هایی که فقط SOCKS می‌دهند (حالت نادر): ترافیک UI از آن
#        رد می‌شود ولی سمت سرور HTTP proxy لازم است (بیشتر ابزارها مثل
#        v2rayN/Clash روی System Proxy، پروکسی HTTP هم باز می‌کنند).
#      - اگر برنامه را قبل از روشن‌کردن فیلترشکن باز کنید: ترافیک UI بلافاصله
#        از فیلترشکن رد می‌شود، ولی برای ترافیک سمت سرور (AI) یک‌بار برنامه
#        را ببندید و باز کنید (تشخیص پروکسی سرور، هنگام اجراست).
#      - فیلترشکن از نوع TUN/مانیتور کل سیستم: نیازی به هیچ کاری نیست.
#  • برای قابلیت‌های ابری سمت سرور (اختیاری): فایل .env را در
#    %APPDATA%/Weekly Planner بگذارید (GEMINI_API_KEY، FIREBASE_SERVICE_ACCOUNT_KEY،
#    SQL_*). بدون آن هم برنامه بالا می‌آید؛ فقط سینک ابریِ سمت سرور و
#    کلید سروری Gemini غیرفعال است (کلید شخصی خودتان از تنظیمات برنامه
#    کار می‌کند چون از مرورگر/سرور لوکال با همان VPN عبور می‌کند).
#
#  خروجی‌ها (نسخه از package.json خوانده می‌شود - الان 1.7.1):
#    - Weekly-Planner-Setup-1.7.1-x64.exe      (نصب‌کننده NSIS)
#    - Weekly-Planner-Portable-1.7.1-x64.exe   (نسخه پرتابل بدون نصب)
#
#  نکته مهم برای کاربران ایران:
#    آرتیفکت‌های Actions برای دانلود به حساب گیتهاب نیاز دارند؛ اما اگر روی
#    تگ v* پوش کنید (مثلاً v1.7.0)، فایل‌ها به‌صورت GitHub Release منتشر
#    می‌شوند که از ایران بدون محدودیت قابل دانلود است.
#
#  ── آپدیت درجا (بدون پاک‌کردن نصب قبلی) ────────────────────────────────────
#  • شناسهٔ برنامه عین بیلدهای قبلی است (appId=com.ndredev.weeklyplanner و
#    نام Weekly Planner)؛ پس ویندوز آن را «همان برنامه» می‌شناسد. اجرای
#    Setup جدید، نسخهٔ قبلی را خودکار عوض می‌کند: پوشهٔ دادهٔ
#    ‎%APPDATA%\Weekly Planner (اطلاعات آفلاین و صف سینک) دست‌نخورده می‌ماند
#    و شورتکات‌ها فقط به‌روز می‌شوند. لازم نیست چیزی را Uninstall کنید.
#  • شرط آپدیت، یکی‌بودن «شناسه» است نه برابر بودن «شماره نسخه»؛ شمارهٔ
#    نسخهٔ جدید باید از نصب‌شده بزرگ‌تر یا مساوی باشد. نسخه از package.json
#    ریشه خوانده می‌شود (الان 1.7.1) و با گیت APP_VERSION قفل شده است؛
#    بنابراین برچسب‌زدن نسخهٔ دیگر (مثل 1.5.0) بدون دروغ نسخه ممکن نیست.
#
#  ── لوگو/آیکون برنامه (WPR) ────────────────────────────────────────────────
#  الزامی: فایل app-icon-rounded-light-512.png را در «ریشهٔ ریپو» آپلود کنید.
#  اولویت جست‌وجو: windows-icon.ico (ریشه) ← build/icon.png ←
#  build/app-icon-rounded-light-512.png ← app-icon-rounded-light-512.png
#  (ریشه) ← wpr-monogram-black-512.png (ریشه؛ با هشدار کم‌رنگی).
#  ورک‌فلو خودش PNG را به ICO چندسایزی 16..256 تبدیل می‌کند. اگر هیچ‌کدام
#  نباشد، بیلد عمداً با خطای واضح متوقف می‌شود (خروجی بی‌لوگو ممنوع).
#
#  نکته‌های اختیاری:
#    - اگر Secret با نام GEMINI_API_KEY تعریف کنید، داخل بیلد قرار می‌گیرد
#      (فقط برای بیلدهای شخصی؛ هرگز ریپو عمومی را با کلید بیلد نکنید).
#    - نصب‌کننده امضای دیجیتال ندارد؛ اولین اجرا ممکن است پیام SmartScreen
#      بدهد → «More info» و بعد «Run anyway».
#    - ویندوز ۱۰ به بالا (Electron 38). برای ویندوز ۷ باید Electron 22 شود.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows x64 (Electron + local API server + VPN-aware)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      # گیت هویت: نسخه داخل کد باید با package.json یکی باشد (دروغ نسخه ممنوع)
      - name: Verify version consistency (types.APP_VERSION == package.json)
        run: |
          node -e "
            const fs = require('fs');
            const t = fs.readFileSync('src/types.ts', 'utf8');
            const m = t.match(/APP_VERSION = \"([^\"]+)\"/);
            if (!m) { console.error('FATAL: APP_VERSION not found in src/types.ts'); process.exit(1); }
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            if (m[1] !== p) { console.error('FATAL: version mismatch types=' + m[1] + ' package=' + p); process.exit(1); }
            console.log('Version OK: ' + p);
          "

      # ── ایران‌پسند: فونت‌ها به‌جای CDN گوگل، از پکیج‌های npm باندل می‌شوند ──
      - name: Install local font packages (offline / Iran-safe)
        run: npm install --no-save --no-audit --no-fund vazirmatn @fontsource/inter

      - name: Patch index.css - replace Google Fonts CDN with bundled fonts
        run: |
          cat > patch-fonts.cjs <<'PATCH_EOF'
          const fs = require('fs');
          const p = 'src/index.css';
          let css = fs.readFileSync(p, 'utf8');
          const cdnRe = /@import\s+url\(\s*'https:\/\/fonts\.googleapis\.com[^)]*'\s*\)\s*;/;
          if (!cdnRe.test(css)) {
            if (css.indexOf('vazirmatn/Vazirmatn-font-face.css') !== -1) {
              console.log('index.css already patched (idempotent re-run) - nothing to do.');
              process.exit(0);
            }
            console.error('FATAL: Google Fonts @import not found in src/index.css');
            process.exit(1);
          }
          const localImports = [
            '@import "vazirmatn/Vazirmatn-font-face.css";',
            '@import "@fontsource/inter/300.css";',
            '@import "@fontsource/inter/400.css";',
            '@import "@fontsource/inter/500.css";',
            '@import "@fontsource/inter/600.css";',
            '@import "@fontsource/inter/700.css";'
          ].join('\n');
          css = css.replace(cdnRe, localImports);
          fs.writeFileSync(p, css);
          console.log('index.css patched: fonts are now bundled locally.');
          PATCH_EOF
          node patch-fonts.cjs
          rm -f patch-fonts.cjs
          grep -q 'vazirmatn/Vazirmatn-font-face.css' src/index.css
          if grep -q 'fonts.googleapis.com' src/index.css; then
            echo 'FATAL: Google Fonts CDN still referenced in src/index.css'
            exit 1
          fi
          echo 'Verified: no Google Fonts CDN reference remains.'

      - name: Build frontend (Vite)
        run: npx vite build

      - name: Build API server bundle (esbuild - same as npm run build)
        run: npx esbuild server.ts --bundle --platform=node --format=cjs --packages=external --sourcemap --outfile=dist/server.cjs

      # ── پچ سرور: پورت از لانچر Electron + گوش‌دادن فقط روی لوکال‌هاست ──
      # نکتهٔ تأییدشده با بیلد واقعی: esbuild عدد 3000 را «3e3» و const را
      # گاهی var می‌کند؛ بنابراین الگو هر دو حالت را پوشش می‌دهد.
      - name: Patch server bundle (configurable port + loopback bind)
        run: |
          cat > patch-port.cjs <<'PORTEOF'
          const fs = require('fs');
          const p = 'dist/server.cjs';
          let s = fs.readFileSync(p, 'utf8');
          const before = s;
          s = s.replace(/(?:var|const|let) PORT = (?:3e3|3000);/, 'var PORT = Number(process.env.PORT) || 3000;');
          if (s === before) { console.error('FATAL: PORT declaration not found in bundle'); process.exit(1); }
          s = s.replace('app.listen(PORT, "0.0.0.0"', 'app.listen(PORT, "127.0.0.1"');
          if (!s.includes('app.listen(PORT, "127.0.0.1"')) { console.error('FATAL: listen patch failed'); process.exit(1); }
          fs.writeFileSync(p, s);
          console.log('Server patched: PORT from launcher env, bound to 127.0.0.1 (no firewall popup).');
          PORTEOF
          node patch-port.cjs
          rm -f patch-port.cjs
          grep -q 'process.env.PORT' dist/server.cjs
          echo 'Verified: bundle now reads PORT from environment.'

      # ── ساخت اسکلت اپ Electron (لانچر + کانفیگ بیلد) ──
      - name: Scaffold Electron app (launcher + package config)
        run: |
          mkdir -p electron-app/server-dist electron-app/build
          cp -r dist electron-app/dist
          rm -f electron-app/dist/server.cjs electron-app/dist/server.cjs.map
          cp dist/server.cjs electron-app/server-dist/server.cjs
          cp dist/server.cjs.map electron-app/server-dist/server.cjs.map 2>/dev/null || true

          # ── آیکون اختصاصی (لوگوی WPR): تبدیل خودکار PNG به ICO چندسایزی ──
          ICON_SRC=""
          if [ -f windows-icon.ico ]; then
            cp windows-icon.ico electron-app/build/icon.ico
            echo 'ICON: windows-icon.ico (repo root) applied directly.'
          else
            for c in build/icon.png build/app-icon-rounded-light-512.png app-icon-rounded-light-512.png wpr-monogram-black-512.png; do
              if [ -f "$c" ]; then ICON_SRC="$c"; break; fi
            done
            if [ -n "$ICON_SRC" ]; then
              if [ "$ICON_SRC" = "wpr-monogram-black-512.png" ]; then
                echo 'WARNING: black monogram on transparent background - weak visibility on dark taskbars; prefer app-icon-rounded-light-512.png.'
              fi
              python -c "import PIL" 2>/dev/null || python -m pip install --quiet --disable-pip-version-check pillow
              python - "$ICON_SRC" electron-app/build/icon.ico <<'ICOEOF'
          import sys
          from PIL import Image
          src, dst = sys.argv[1], sys.argv[2]
          im = Image.open(src).convert('RGBA')
          side = max(im.size)
          canvas = Image.new('RGBA', (side, side), (0, 0, 0, 0))
          canvas.paste(im, ((side - im.size[0]) // 2, (side - im.size[1]) // 2), im)
          if side > 256:
              canvas = canvas.resize((256, 256), Image.LANCZOS)
          canvas.save(dst, format='ICO', sizes=[(256, 256), (128, 128), (64, 64), (48, 48), (32, 32), (24, 24), (16, 16)])
          print('ICO written:', dst)
          ICOEOF
              ls -la electron-app/build/icon.ico
              echo "ICON: multi-size icon.ico generated from $ICON_SRC"
            else
              echo 'FATAL: no app logo found in the repo. Upload app-icon-rounded-light-512.png to the repository ROOT (exact same filename) and re-run the build. The build refuses to produce a logo-less exe.'
              exit 1
            fi
          fi

          # NOTE: do NOT add "win.publisherName" - it was removed from the electron-builder 26.x
          # schema and triggers: "configuration.win should be one of these: null".
          # Publisher identity comes from the "author" field below.
          # version/dependencies بعداً در collect-deps از ریشه پروژه + باندل سرور پر می‌شوند.
          cat > electron-app/package.json <<'PKG_EOF'
          {
            "name": "weekly-planner",
            "productName": "Weekly Planner",
            "private": true,
            "description": "Weekly Planner - offline-capable Persian weekly planner (Windows build)",
            "main": "main.js",
            "author": "ndredev",
            "devDependencies": {
              "electron-builder": "26.15.3"
            },
            "build": {
              "appId": "com.ndredev.weeklyplanner",
              "productName": "Weekly Planner",
              "copyright": "Copyright © 2026 ndredev",
              "electronVersion": "38.0.0",
              "asar": false,
              "directories": {
                "output": "release"
              },
              "files": [
                "main.js",
                "package.json",
                ".env",
                "dist/**/*",
                "server-dist/**/*",
                "node_modules/**/*",
                "!node_modules/electron-builder/**",
                "!node_modules/.bin/**",
                "!node_modules/**/.bin/**"
              ],
              "win": {
                "target": [
                  { "target": "nsis", "arch": ["x64"] },
                  { "target": "portable", "arch": ["x64"] }
                ]
              },
              "nsis": {
                "oneClick": false,
                "perMachine": false,
                "allowToChangeInstallationDirectory": true,
                "createDesktopShortcut": true,
                "shortcutName": "Weekly Planner",
                "artifactName": "Weekly-Planner-Setup-${version}-${arch}.${ext}"
              },
              "portable": {
                "artifactName": "Weekly-Planner-Portable-${version}-${arch}.${ext}"
              }
            }
          }
          PKG_EOF

          cat > electron-app/main.js <<'MAIN_EOF'
          /* Weekly Planner - Electron launcher (1.7.0, VPN-aware)
           * سرور API اکسپرس (server-dist/server.cjs) را به‌صورت پروسه Node لوکال
           * اجرا می‌کند و رابط کاربری بیلدشده (dist/) را در پنجره برنامه باز می‌کند.
           * همه‌چیز از http://localhost:<port> سرو می‌شود - کاملاً قابلیت آفلاین دارد.
           *
           * VPN/فیلترشکن:
           *  - پنجره برنامه (Chromium) به‌صورت پیش‌فرض «پروکسی سیستمی ویندوز» را
           *    دنبال می‌کند؛ هیچ‌چیز آن را بازنویسی نمی‌کند (بدون --no-proxy-server).
           *  - سرور Node چون پروکسی سیستمی ویندوز را نمی‌بیند، پیش از spawn، پروکسی
           *    سیستمی با session.resolveProxy تشخیص داده می‌شود و به‌صورت
           *    HTTPS_PROXY/HTTP_PROXY/NO_PROXY به پروسه سرور تزریق می‌شود؛ server.ts
           *    با EnvHttpProxyAgent (undici) و firebase-admin با HttpsProxyAgent
           *    آن را اعمال می‌کند (در server.log قابل مشاهده است).
           */
          const { app, BrowserWindow, Menu, dialog, shell, session } = require('electron');
          const { spawn } = require('child_process');
          const http = require('http');
          const net = require('net');
          const path = require('path');
          const fs = require('fs');

          /* Google OAuth با UA حاوی Electron/app-name رد می‌شود؛ توکن‌های
          غیرمرورگری را از UA سراسری حذف می‌کنیم (قبل از ساخت هر پنجره). */
          try {
            app.userAgentFallback = app.userAgentFallback
              .replace(/\sElectron\/[\d.]+/i, '')
              .replace(/\sweekly-planner\/[\d.]+/i, '');
            log('UA fallback set:', app.userAgentFallback);
          } catch (e) { log('UA fallback error:', e && e.message); }

          const APP_DIR = __dirname;
          const SERVER_SCRIPT = path.join(APP_DIR, 'server-dist', 'server.cjs');
          const BASE_PORT = Number(process.env.PLANNER_PORT) || 3000;
          const PORT_SCAN = 20;

          let serverProc = null;
          let mainWindow = null;
          let creating = false;
          let logFilePath = null;
          const LOG_LINES = [];

          function log() {
            try {
              console.log.apply(console, ['[weekly-planner]'].concat([].slice.call(arguments)));
            } catch (e) { /* ignore */ }
          }

          /* خروجی سرور فرزند هم در کنسول نوشته می‌شود و هم در فایل لاگ
           * (%APPDATA%/Weekly Planner/server.log) ذخیره می‌شود تا اگر روزی
           * سرور بالا نیامد، علت واقعی در دیالوگ خطا و فایل لاگ دیده شود. */
          function captureServerOutput(chunk, isErr) {
            String(chunk).split(/\r?\n/).forEach((line) => {
              if (!line.trim()) return;
              const stamped = new Date().toISOString() + (isErr ? ' [err] ' : ' ') + line;
              LOG_LINES.push(stamped);
              if (LOG_LINES.length > 200) LOG_LINES.shift();
              if (logFilePath) {
                try { fs.appendFileSync(logFilePath, stamped + '\n'); } catch (e) { /* ignore */ }
              }
            });
          }

          function serverLogTail() {
            return LOG_LINES.slice(-15).join('\n');
          }

          function isPortFree(port) {
            return new Promise((resolve) => {
              const srv = net.createServer();
              srv.once('error', () => resolve(false));
              srv.once('listening', () => srv.close(() => resolve(true)));
              srv.listen(port, '127.0.0.1');
            });
          }

          async function pickFreePort() {
            for (let p = BASE_PORT; p < BASE_PORT + PORT_SCAN; p++) {
              if (await isPortFree(p)) return p;
            }
            throw new Error('No free port in range ' + BASE_PORT + '..' + (BASE_PORT + PORT_SCAN - 1));
          }

          /* ── تشخیص پروکسی سیستمی ویندوز از موتور شبکه خود Chromium ──
           * خروجی resolveProxy چیزی شبیه این‌هاست:
           *   DIRECT | PROXY 127.0.0.1:10809 | PROXY a:80; PROXY b:80; DIRECT | SOCKS5 127.0.0.1:10808
           * فقط پروکسی HTTP را برمی‌گردانیم (undici/HttpsProxyAgent با HTTP proxy کار می‌کند).
           * SOCKS را با پرچم گزارش می‌کنیم (UI از Chromium رد می‌شود، سمت سرور خیر). */
          function parseProxyResult(raw) {
            if (!raw) return null;
            const parts = String(raw).split(';').map((s) => s.trim()).filter(Boolean);
            for (let i = 0; i < parts.length; i++) {
              const p = parts[i];
              if (/^DIRECT$/i.test(p)) continue;
              const m = p.match(/^(PROXY|HTTPS|SOCKS|SOCKS4|SOCKS5)\s+([^\s:]+):(\d+)$/i);
              if (!m) continue;
              const scheme = m[1].toUpperCase();
              if (scheme === 'SOCKS' || scheme === 'SOCKS4' || scheme === 'SOCKS5') {
                return { url: null, raw: p, socks: true };
              }
              return { url: 'http://' + m[2] + ':' + m[3], raw: p, socks: false };
            }
            return null;
          }

          function detectSystemProxy(timeoutMs) {
            return new Promise((resolve) => {
              let settled = false;
              const done = (v) => { if (!settled) { settled = true; resolve(v); } };
              const timer = setTimeout(() => done(null), timeoutMs || 3000);
              try {
                session.defaultSession.resolveProxy('https://generativelanguage.googleapis.com/')
                  .then((raw) => { clearTimeout(timer); done(parseProxyResult(raw)); })
                  .catch(() => { clearTimeout(timer); done(null); });
              } catch (e) {
                clearTimeout(timer);
                done(null);
              }
            });
          }

          /* متغیرهای محیطی پروسه سرور؛ اگر کاربر خودش HTTPS_PROXY ست کرده باشد
           * تشخیص خودکار را دور می‌زنیم (حاکمیت تنظیم دستی کاربر). */
          async function buildServerEnv(port) {
            const env = Object.assign({}, process.env, {
              ELECTRON_RUN_AS_NODE: '1',
              ELECTRON_NO_ATTACH_CONSOLE: '1',
              NODE_ENV: 'production',
              PORT: String(port)
            });
            const userSet = !!(process.env.HTTPS_PROXY || process.env.HTTP_PROXY ||
                               process.env.https_proxy || process.env.http_proxy);
            if (userSet) {
              log('HTTPS_PROXY/HTTP_PROXY already set by user - skipping auto detection');
              return env;
            }
            const proxy = await detectSystemProxy(3000);
            if (proxy && proxy.url) {
              env.HTTPS_PROXY = proxy.url;
              env.HTTP_PROXY = proxy.url;
              env.https_proxy = proxy.url;
              env.http_proxy = proxy.url;
              env.NO_PROXY = 'localhost,127.0.0.1,::1';
              env.no_proxy = env.NO_PROXY;
              log('system proxy detected (' + proxy.raw + ') -> server outbound (Gemini/Firebase Admin) will use it');
            } else if (proxy && proxy.socks) {
              log('system proxy is SOCKS (' + proxy.raw + ') -> UI traffic uses it via Chromium; for server-side AI set HTTPS_PROXY to an HTTP proxy');
            } else {
              log('no system proxy detected -> server outbound goes direct');
            }
            return env;
          }

          function startServer(port, env) {
            log('starting local API server on 127.0.0.1:' + port);
            const proc = spawn(process.execPath, [SERVER_SCRIPT], {
              cwd: APP_DIR,
              env: env,
              windowsHide: true,
              stdio: ['ignore', 'pipe', 'pipe']
            });
            proc.stdout.on('data', (d) => { process.stdout.write('[server] ' + d); captureServerOutput(d, false); });
            proc.stderr.on('data', (d) => { process.stderr.write('[server] ' + d); captureServerOutput(d, true); });
            proc.on('exit', (code, signal) => {
              log('server exited', { code: code, signal: signal });
              if (serverProc === proc) serverProc = null;
            });
            return proc;
          }

          function waitForServer(port, timeoutMs) {
            return new Promise((resolve, reject) => {
              let settled = false;
              const fail = (why) => { if (!settled) { settled = true; reject(new Error(why)); } };
              const ok = () => { if (!settled) { settled = true; resolve(); } };
              /* اگر پروسه سرور قبل از آماده‌شدن بمیرد، به‌جای صبر ۳۰ ثانیه‌ای
               * تا timeout، همان لحظه علت واقعی + آخرین لاگ‌ها نشان داده می‌شود. */
              if (serverProc) {
                serverProc.once('exit', (code, signal) => {
                  fail('server process exited prematurely (' + (signal ? 'signal ' + signal : 'code ' + code) + ')' +
                    '\n\n--- آخرین خطوط لاگ سرور ---\n' + serverLogTail());
                });
              }
              const deadline = Date.now() + (timeoutMs || 30000);
              const attempt = () => {
                if (settled) return;
                if (Date.now() > deadline) {
                  return fail('timeout' + '\n\n--- آخرین خطوط لاگ سرور ---\n' + serverLogTail());
                }
                const req = http.get({ host: '127.0.0.1', port: port, path: '/', timeout: 2500 }, (res) => {
                  res.resume();
                  ok();
                });
                req.on('timeout', () => req.destroy(new Error('probe timeout')));
                req.on('error', () => setTimeout(attempt, 400));
              };
              attempt();
            });
          }

          /* اگر کاربر فایل .env را در پوشه تنظیمات برنامه (%APPDATA%/Weekly Planner)
           * بگذارد، به کنار سرور کپی می‌شود تا قابلیت‌های ابری (Gemini/Firebase/PG)
           * با کلیدهای خود کاربر فعال شوند. */
          function copyUserEnv() {
            try {
              const userEnv = path.join(app.getPath('userData'), '.env');
              if (fs.existsSync(userEnv)) {
                fs.copyFileSync(userEnv, path.join(APP_DIR, '.env'));
                log('user .env applied from', userEnv);
              }
            } catch (e) { log('copyUserEnv skipped:', e && e.message); }
          }

          function killServer() {
            if (serverProc) {
              try { serverProc.kill(); } catch (e) { /* ignore */ }
              serverProc = null;
            }
          }

          const SPLASH_HTML = '<!doctype html><html dir="rtl" lang="fa"><head><meta charset="utf-8">' +
            '<style>body{margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f8fafc;font-family:Vazirmatn,Tahoma,sans-serif;color:#334155}' +
            '.ring{width:44px;height:44px;border:4px solid #e2e8f0;border-top-color:#0ea5e9;border-radius:50%;animation:sp 1s linear infinite}' +
            '@keyframes sp{to{transform:rotate(360deg)}}p{margin-top:16px;font-size:14px}</style></head>' +
            '<body><div class="ring"></div><p>در حال راه‌اندازی…</p></body></html>';

          async function createWindow() {
            if (creating || mainWindow) return;
            creating = true;
            try {
              copyUserEnv();

              try {
                logFilePath = path.join(app.getPath('userData'), 'server.log');
                fs.appendFileSync(logFilePath, '\n=== ' + new Date().toISOString() + ' launch ===\n');
              } catch (e) { logFilePath = null; }

              mainWindow = new BrowserWindow({
                width: 1366,
                height: 860,
                minWidth: 1024,
                minHeight: 640,
                show: false,
                autoHideMenuBar: true,
                backgroundColor: '#f8fafc',
                title: 'Weekly Planner',
                webPreferences: {
                  contextIsolation: true,
                  nodeIntegration: false,
                  spellcheck: false
                }
              });
              mainWindow.setMenuBarVisibility(false);
              mainWindow.once('ready-to-show', () => mainWindow.show());

              /* پاپ‌آپ‌های OAuth گوگل (ورود با گوگل / جیمیل / تقویم) باید داخل
               * برنامه باز شوند تا جریان postMessage فایربیس کار کند؛ این
               * پنجره‌ها هم session مشترک دارند و از پروکسی سیستمی رد می‌شوند. */
              mainWindow.webContents.setWindowOpenHandler(() => ({
                action: 'allow',
                overrideBrowserWindowOptions: {
                  width: 520,
                  height: 640,
                  autoHideMenuBar: true,
                  parent: mainWindow,
                  modal: false,
                  title: 'Weekly Planner',
                  backgroundColor: '#f8fafc',
                  webPreferences: { contextIsolation: true, nodeIntegration: false, spellcheck: false }
                }
              }));

              mainWindow.webContents.on('will-navigate', (e, url) => {
                if (url.indexOf('http://localhost:') !== 0 && url.indexOf('http://127.0.0.1:') !== 0) {
                  e.preventDefault();
                  shell.openExternal(url);
                }
              });

              mainWindow.loadURL('data:text/html;charset=utf-8,' + encodeURIComponent(SPLASH_HTML));

              const port = await pickFreePort();
              const serverEnv = await buildServerEnv(port);
              serverProc = startServer(port, serverEnv);
              await waitForServer(port, 30000);

              /* localhost (نه 127.0.0.1) تا با دامنه مجاز پیش‌فرض Firebase
               * برای ورود با گوگل سازگار باشد. */
              await mainWindow.loadURL('http://localhost:' + port);
              log('app ready at http://localhost:' + port);
            } catch (err) {
              const msg = err && err.message ? err.message : String(err);
              dialog.showErrorBox('Weekly Planner - خطای راه‌اندازی',
                'راه‌اندازی سرور محلی برنامه ناموفق بود:\n' + msg +
                '\n\nلطفاً برنامه را ببندید و دوباره اجرا کنید.' +
                (logFilePath ? '\n\nگزارش کامل سرور:\n' + logFilePath : ''));
              killServer();
              app.quit();
            } finally {
              creating = false;
            }
          }

          const gotLock = app.requestSingleInstanceLock();
          if (!gotLock) {
            app.quit();
          } else {
            app.on('second-instance', () => {
              if (mainWindow) {
                if (mainWindow.isMinimized()) mainWindow.restore();
                mainWindow.show();
                mainWindow.focus();
              }
            });
            Menu.setApplicationMenu(null);
            app.whenReady().then(createWindow);
          }

          app.on('activate', () => { if (app.isReady()) createWindow(); });
          app.on('window-all-closed', () => { killServer(); app.quit(); });
          app.on('before-quit', killServer);
          process.on('exit', killServer);
          process.on('uncaughtException', (e) => log('uncaughtException:', e));
          process.on('unhandledRejection', (e) => log('unhandledRejection:', e));
          MAIN_EOF

          # ── وابستگی‌های واقعی سرور + استاب vite + نسخهٔ واقعی برنامه ──
          # server.ts در بالای فایل vite را import می‌کند اما فقط در حالت
          # غیر-production استفاده می‌شود (سرور dev). اگر vite در node_modules
          # پکیج‌شده نباشد، سرور همان اول با «Cannot find module 'vite'» کرش
          # می‌کند و لانچر فقط timeout نشان می‌دهد. این اسکریپت:
          #   ۱) vite را استاب می‌کند (چون لانچر همیشه NODE_ENV=production می‌گذارد)
          #   ۲) همه requireهای خارجی باندل را با package.json ریشه تطبیق می‌دهد
          #      و اگر پکیجی کم باشد بیلد را با خطای واضح متوقف می‌کند
          #   ۳) نسخهٔ electron-app را از package.json ریشه (الان 1.7.1) برمی‌دارد
          cat > collect-deps.cjs <<'DEPS_EOF'
          const fs = require('fs');
          const path = require('path');

          const serverPath = 'electron-app/server-dist/server.cjs';
          let bundle = fs.readFileSync(serverPath, 'utf8');

          /* 1) stub the dev-only vite import instead of shipping ~60MB of vite */
          fs.writeFileSync(path.join(path.dirname(serverPath), 'vite-stub.cjs'), [
            '/* Production stub for the dev-only "vite" import in server.ts.',
            ' * The Electron launcher always runs with NODE_ENV=production, so the',
            ' * vite middleware branch in startServer() is never taken. */',
            'module.exports = new Proxy({}, {',
            '  get(target, prop) {',
            '    if (prop === "__esModule") return false;',
            '    return function viteDevStub() {',
            "      throw new Error('vite dev middleware is not available in the packaged app');",
            '    };',
            '  },',
            '});',
            '',
          ].join('\n'));
          const hadVite = /require\(\s*["']vite["']\s*\)/.test(bundle);
          bundle = bundle.replace(/require\(\s*["']vite["']\s*\)/g, 'require("./vite-stub.cjs")');
          bundle = bundle.replace(/import\(\s*["']vite["']\s*\)/g, 'Promise.resolve(require("./vite-stub.cjs"))');
          fs.writeFileSync(serverPath, bundle);
          console.log(hadVite
            ? 'vite import stubbed out (dev-only middleware; not shipped in the package).'
            : 'No vite require found in bundle (nothing to stub).');

          /* 2) collect every external package the bundle requires and make sure
           *    electron-app/package.json declares it (that is what ships). */
          const BUILTINS = new Set(('assert,async_hooks,buffer,child_process,cluster,console,constants,crypto,' +
            'dgram,dns,domain,events,fs,http,http2,https,inspector,module,net,os,path,perf_hooks,process,' +
            'punycode,querystring,readline,repl,stream,string_decoder,timers,tls,trace_events,tty,url,util,' +
            'v8,vm,worker_threads,zlib,sys').split(','));
          const found = new Set();
          const re = /require\(\s*["']([@a-zA-Z0-9][^"']*)["']\s*\)/g;
          let m;
          while ((m = re.exec(bundle)) !== null) {
            const spec = m[1];
            if (spec.startsWith('.') || spec.startsWith('/') || spec.startsWith('node:')) continue;
            if (spec === './vite-stub.cjs') continue;
            const top = spec.startsWith('@') ? spec.split('/').slice(0, 2).join('/') : spec.split('/')[0];
            if (!BUILTINS.has(top)) found.add(top);
          }
          const rootPkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const deps = {};
          const missing = [];
          for (const name of Array.from(found).sort()) {
            const v = (rootPkg.dependencies && rootPkg.dependencies[name]) ||
                      (rootPkg.devDependencies && rootPkg.devDependencies[name]);
            if (!v) { missing.push(name); continue; }
            deps[name] = v;
          }
          if (missing.length) {
            console.error('FATAL: bundled server requires packages missing from root package.json: ' + missing.join(', '));
            process.exit(1);
          }
          const appPkgPath = 'electron-app/package.json';
          const appPkg = JSON.parse(fs.readFileSync(appPkgPath, 'utf8'));
          appPkg.dependencies = deps;
          appPkg.version = rootPkg.version;
          fs.writeFileSync(appPkgPath, JSON.stringify(appPkg, null, 2) + '\n');
          console.log('electron-app version=' + appPkg.version);
          console.log('electron-app dependencies synced to the bundle requires: ' + Object.keys(deps).join(', '));
          DEPS_EOF
          node collect-deps.cjs
          rm -f collect-deps.cjs

          echo 'Electron scaffold created.'
          node -e "const p=JSON.parse(require('fs').readFileSync('electron-app/package.json','utf8')); if(!p.version||!p.dependencies||!Object.keys(p.dependencies).length){console.error('FATAL: electron-app package.json incomplete');process.exit(1)}; console.log('package.json valid, version='+p.version+', deps='+Object.keys(p.dependencies).length)"

      # ── فایل .env برای سرور لوکال (اختیاری: کلید Gemini از Secrets) ──
      - name: Write .env for local server (optional GEMINI_API_KEY)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > electron-app/.env
            echo 'NOTE: GEMINI_API_KEY baked into this build (personal builds only!).'
          else
            : > electron-app/.env
            echo 'No GEMINI_API_KEY secret provided - empty .env created.'
          fi

      - name: Install Electron app dependencies
        working-directory: electron-app
        run: npm install --no-audit --no-fund

      - name: Package Windows executables (NSIS setup + portable)
        working-directory: electron-app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --publish never

      - name: List build outputs
        run: ls -la electron-app/release

      - name: Upload Windows EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Weekly-Planner-Windows-x64
          path: electron-app/release/*.exe
          if-no-files-found: error

      # انتشار به‌صورت Release روی تگ‌های v* — از ایران بدون محدودیت دانلود می‌شود
      - name: Publish GitHub Release (only on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: electron-app/release/*.exe
          generate_release_notes: true
