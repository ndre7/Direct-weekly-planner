name: Build & Release (Android APK & Windows/Web)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-web-and-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17 (Required for Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Build Web Dist
        run: npx vite build

      - name: Install & Setup Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --no-audit --no-fund
          npx cap add android || true
          npx cap sync android

      - name: Build Android APK (Universal - Android 9+)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Direct-Planner-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Windows & Web Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Direct-Planner-Web-Windows-Dist
          path: dist/
